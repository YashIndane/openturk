[project]
name = "openturk"
version = "0.1.0"
description = "Flask API for OpenTurk Chess Machine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "Flask",
    "Pillow",
    "openai",
    "stockfish",
    "python-chess",
    "cryptography",
    "pyopenssl",
    "requests",
]
