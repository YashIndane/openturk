<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap');

  :root{
    --bg: #2b2b2b;
    --border-dark: #2b2b2b;
    --sq-light: #eeeed2;
    --sq-dark: #769656;
    --cream: #f2f2ea;
    --accent: #8fae7a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: #1e1e1e;
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 20px;
    padding: 40px 20px 60px;
    width:100%;
  }

  .board-wrap{
    padding: 10px;
    border-radius: 10px;
    background: var(--border-dark);
    box-shadow: 0 20px 45px -15px rgba(0,0,0,0.6);
  }

  .board{
    --size: min(80vw, 80vh, 560px);
    width: var(--size);
    height: var(--size);
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border-radius: 4px;
    overflow:hidden;
  }

  .sq{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sq.light{ background: var(--sq-light); }
  .sq.dark{ background: var(--sq-dark); }

  .piece-img{
    width: 82%;
    height: 82%;
    object-fit: contain;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
    user-select:none;
    pointer-events:none;
    transition: transform 0.12s ease;
  }
  .sq:hover .piece-img{ transform: translateY(-2px) scale(1.04); }

  .controls{
    width: min(560px, 92vw);
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  details{
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 4px 16px;
  }
  summary{
    cursor:pointer;
    padding: 10px 0;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    outline:none;
  }
  summary::marker{ color: var(--accent); }

  .panel-body{
    padding: 4px 0 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  textarea{
    width:100%;
    min-height: 110px;
    resize: vertical;
    background: #111;
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: 'Jost', monospace;
    font-size: 13px;
    line-height:1.5;
  }
  textarea::placeholder{ color: #7a7a72; }

  .btn-row{
    display:flex;
    gap: 8px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform:uppercase;
    padding: 9px 16px;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover{
    background: var(--accent);
    color: #14200f;
  }
  button.primary{
    background: var(--accent);
    color: #14200f;
  }
  button.primary:hover{
    background: #a3c68c;
  }

  .status{
    font-size: 12px;
    color: #b8b8ac;
    min-height: 16px;
  }
  .status.error{ color: #d68a6f; }
  .status.ok{ color: var(--accent); }
</style>
</head>
<body>
  <div class="stage">
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <details>
        <summary>Load a position from your dictionary</summary>
        <div class="panel-body">
          <textarea id="input" placeholder='Paste your dict here, e.g. {"a1": "R", "b1": "N", ..., "e4": ".", ...}'></textarea>
          <div class="btn-row">
            <button class="primary" id="loadBtn">Set position</button>
            <button id="startBtn">Starting position</button>
            <button id="clearBtn">Clear board</button>
          </div>
          <div class="status" id="status"></div>
        </div>
      </details>
    </div>
  </div>

<script>
  const files = ['a','b','c','d','e','f','g','h'];
  const ranks = ['8','7','6','5','4','3','2','1']; // rendered top to bottom

  // Freely licensed (GPL/CC-BY-SA) "cburnett" piece set, as used by lichess.org
  const PIECE_BASE = 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/';
  function pieceUrl(letter){
    const color = letter === letter.toUpperCase() ? 'w' : 'b';
    const type = letter.toUpperCase();
    return PIECE_BASE + color + type + '.svg';
  }

  const startingPosition = {};
  const backRank = ['R','N','B','Q','K','B','N','R'];
  files.forEach((f, i) => {
    startingPosition[f+'1'] = backRank[i];
    startingPosition[f+'2'] = 'P';
    startingPosition[f+'7'] = 'p';
    startingPosition[f+'8'] = backRank[i].toLowerCase();
    for (let r = 3; r <= 6; r++){
      startingPosition[f+r] = '.';
    }
  });

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const inputEl = document.getElementById('input');

  function renderBoard(position){
    boardEl.innerHTML = '';
    ranks.forEach((rank) => {
      files.forEach((file, fileIdx) => {
        const key = file + rank;
        const isLight = (fileIdx + parseInt(rank)) % 2 === 0;
        const sq = document.createElement('div');
        sq.className = 'sq ' + (isLight ? 'light' : 'dark');

        const value = position[key];
        if (value && value !== '.' && 'kqrbnpKQRBNP'.includes(value)){
          const img = document.createElement('img');
          img.className = 'piece-img';
          img.src = pieceUrl(value);
          img.alt = value;
          sq.appendChild(img);
        }

        boardEl.appendChild(sq);
      });
    });
  }

  function parseLenient(text){
    let cleaned = text.trim();
    cleaned = cleaned.replace(/'/g, '"');
    cleaned = cleaned.replace(/\bNone\b/g, 'null');
    cleaned = cleaned.replace(/,\s*([}\]])/g, '$1');
    return JSON.parse(cleaned);
  }

  document.getElementById('loadBtn').addEventListener('click', () => {
    try{
      const parsed = parseLenient(inputEl.value);
      renderBoard(parsed);
      statusEl.textContent = 'Position loaded.';
      statusEl.className = 'status ok';
    }catch(e){
      statusEl.textContent = 'Could not parse that dictionary — check the format and try again.';
      statusEl.className = 'status error';
    }
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    renderBoard(startingPosition);
    inputEl.value = '';
    statusEl.textContent = 'Starting position loaded.';
    statusEl.className = 'status ok';
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    const empty = {};
    files.forEach(f => ranks.forEach(r => empty[f+r] = '.'));
    renderBoard(empty);
    inputEl.value = '';
    statusEl.textContent = 'Board cleared.';
    statusEl.className = 'status ok';
  });

  renderBoard(startingPosition);
</script>
</body>
</html>
